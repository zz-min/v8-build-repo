name: Build V8 Native Libraries

# 수동 실행 (Actions 탭에서 Run workflow 클릭)
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '빌드할 플랫폼 (all / android / darwin-arm64 / darwin-x86_64 / linux-x86_64 / windows-x86_64 / windows-x86)'
        required: true
        default: 'all'

env:
  V8_VERSION: "9.3.345.11"

jobs:
  # ===================================================
  # macOS Apple Silicon (M1/M2/M3/M4)
  # ===================================================
  darwin-arm64:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'darwin-arm64' }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 도구 설치
        run: |
          brew install ninja llvm
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: V8 소스 받기
        run: |
          cd $HOME
          mkdir v8-build && cd v8-build
          gclient config https://chromium.googlesource.com/v8/v8.git
          gclient sync --revision ${{ env.V8_VERSION }} --no-history --shallow

      - name: V8 소스 패치
        run: |
          bash patches/apply-patches.sh $HOME/v8-build/v8

      - name: V8 모놀리스 빌드
        run: |
          cd $HOME/v8-build/v8
          gn gen out/release --args='
            is_debug=false
            target_cpu="arm64"
            host_cpu="arm64"
            target_os="mac"
            v8_monolithic=true
            v8_use_external_startup_data=false
            is_component_build=false
            use_custom_libcxx=false
            use_lld=false
            v8_enable_i18n_support=false
            treat_warnings_as_errors=false
            clang_use_chrome_plugins=false
          '
          ninja -C out/release v8_monolith

      - name: JNI 브릿지 컴파일
        run: |
          mkdir -p build/darwin-arm64
          clang++ \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/darwin \
            -Iv8-include \
            -Ijni \
            -arch arm64 \
            -fPIC -std=c++17 -O3 -DNDEBUG \
            -DV8_COMPRESS_POINTERS \
            -DV8_31BIT_SMIS_ON_64BIT_ARCH \
            -w \
            -c jni/kr_co_coocon_v8_V8Impl.cpp \
            -o build/darwin-arm64/v8impl.o

          clang++ \
            -shared \
            -arch arm64 \
            -lc++ \
            -undefined dynamic_lookup \
            -o build/darwin-arm64/libcooconv8.dylib \
            build/darwin-arm64/v8impl.o \
            $HOME/v8-build/v8/out/release/obj/libv8_monolith.a

      - name: 검증
        run: |
          file build/darwin-arm64/libcooconv8.dylib
          ls -lh build/darwin-arm64/libcooconv8.dylib

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: build/darwin-arm64/libcooconv8.dylib

  # ===================================================
  # macOS Intel
  # ===================================================
  darwin-x86_64:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'darwin-x86_64' }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 도구 설치
        run: |
          brew install ninja llvm
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: V8 소스 받기
        run: |
          cd $HOME
          mkdir v8-build && cd v8-build
          gclient config https://chromium.googlesource.com/v8/v8.git
          gclient sync --revision ${{ env.V8_VERSION }} --no-history --shallow

      - name: V8 소스 패치
        run: |
          bash patches/apply-patches.sh $HOME/v8-build/v8

      - name: V8 모놀리스 빌드
        run: |
          cd $HOME/v8-build/v8
          gn gen out/release --args='
            is_debug=false
            target_cpu="x64"
            host_cpu="x64"
            target_os="mac"
            v8_monolithic=true
            v8_use_external_startup_data=false
            is_component_build=false
            use_custom_libcxx=false
            use_lld=false
            v8_enable_i18n_support=false
            treat_warnings_as_errors=false
            clang_use_chrome_plugins=false
          '
          ninja -C out/release v8_monolith

      - name: JNI 브릿지 컴파일
        run: |
          mkdir -p build/darwin-x86_64
          clang++ \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/darwin \
            -Iv8-include \
            -Ijni \
            -arch x86_64 \
            -fPIC -std=c++17 -O3 -DNDEBUG \
            -DV8_COMPRESS_POINTERS \
            -DV8_31BIT_SMIS_ON_64BIT_ARCH \
            -w \
            -c jni/kr_co_coocon_v8_V8Impl.cpp \
            -o build/darwin-x86_64/v8impl.o

          clang++ \
            -shared \
            -arch x86_64 \
            -lc++ \
            -undefined dynamic_lookup \
            -o build/darwin-x86_64/libcooconv8.dylib \
            build/darwin-x86_64/v8impl.o \
            $HOME/v8-build/v8/out/release/obj/libv8_monolith.a

      - name: 검증
        run: |
          file build/darwin-x86_64/libcooconv8.dylib
          ls -lh build/darwin-x86_64/libcooconv8.dylib

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: darwin-x86_64
          path: build/darwin-x86_64/libcooconv8.dylib

  # ===================================================
  # Linux x86_64
  # ===================================================
  linux-x86_64:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-x86_64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld llvm
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: V8 소스 받기
        run: |
          cd $HOME
          mkdir v8-build && cd v8-build
          gclient config https://chromium.googlesource.com/v8/v8.git
          gclient sync --revision ${{ env.V8_VERSION }} --no-history --shallow

      - name: V8 소스 패치
        run: |
          bash patches/apply-patches.sh $HOME/v8-build/v8

      - name: V8 모놀리스 빌드 (호스트 Ubuntu)
        run: |
          cd $HOME/v8-build/v8
          gn gen out/release --args='
            is_debug=false
            target_cpu="x64"
            host_cpu="x64"
            target_os="linux"
            v8_monolithic=true
            v8_use_external_startup_data=false
            is_component_build=false
            use_custom_libcxx=false
            v8_enable_i18n_support=false
            treat_warnings_as_errors=false
            clang_use_chrome_plugins=false
          '
          ninja -C out/release v8_monolith

      - name: JNI 브릿지 컴파일 (CentOS 7 Docker — glibc 2.17 호환)
        run: |
          # V8 모놀리스 + 번들 clang을 Docker에 마운트하여 CentOS 7에서 링크
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/v8-build:/v8-build \
            centos:7 \
            /bin/bash -c '
              set -e
              export LANG=en_US.UTF-8
              export PYTHONIOENCODING=utf-8

              # CentOS 7 vault repo
              sed -i "s/mirrorlist/#mirrorlist/g" /etc/yum.repos.d/CentOS-*.repo
              sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*.repo
              yum install -y gcc gcc-c++ tar curl which file binutils centos-release-scl
              # vault repo for ALL SCL repos
              for f in /etc/yum.repos.d/CentOS-SCL*.repo; do
                [ -f "$f" ] && sed -i "s/mirrorlist/#mirrorlist/g" "$f"
                [ -f "$f" ] && sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" "$f"
                [ -f "$f" ] && sed -i "s|# baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" "$f"
              done
              yum install -y devtoolset-11-gcc-c++ || yum install -y devtoolset-9-gcc-c++ || yum install -y devtoolset-8-gcc-c++
              # devtoolset 활성화
              DTS=$(ls -d /opt/rh/devtoolset-* 2>/dev/null | sort -V | tail -1)
              echo "Using devtoolset: $DTS"
              source $DTS/enable
              g++ --version

              # JDK
              cd /tmp
              curl -sLO https://cdn.azul.com/zulu/bin/zulu17.54.21-ca-jdk17.0.13-linux_x64.tar.gz
              tar xzf zulu17*.tar.gz -C /opt/
              export JAVA_HOME=/opt/zulu17.54.21-ca-jdk17.0.13-linux_x64

              # devtoolset g++로 컴파일 (glibc는 시스템 2.17 유지)
              mkdir -p /workspace/build/linux-x86_64

              g++ \
                -I$JAVA_HOME/include \
                -I$JAVA_HOME/include/linux \
                -I/workspace/v8-include \
                -I/workspace/jni \
                -fPIC -std=c++17 -O3 -DNDEBUG \
                -DV8_COMPRESS_POINTERS \
                -DV8_31BIT_SMIS_ON_64BIT_ARCH \
                -w \
                -c /workspace/jni/kr_co_coocon_v8_V8Impl.cpp \
                -o /workspace/build/linux-x86_64/v8impl.o

              g++ \
                -shared \
                -o /workspace/build/linux-x86_64/libcooconv8.so \
                /workspace/build/linux-x86_64/v8impl.o \
                /v8-build/v8/out/release/obj/libv8_monolith.a \
                -lstdc++ -lrt -ldl -lpthread \
                -s

              file /workspace/build/linux-x86_64/libcooconv8.so
              ls -lh /workspace/build/linux-x86_64/libcooconv8.so
              echo "최소 요구 GLIBC: $(objdump -T /workspace/build/linux-x86_64/libcooconv8.so 2>/dev/null | grep GLIBC | sed "s/.*GLIBC_//" | sort -V | tail -1)"
            '

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/linux-x86_64/libcooconv8.so

  # ===================================================
  # Windows x86_64
  # ===================================================
  windows-x86_64:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows-x86_64' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'    # Google 내부 toolchain 대신 로컬 Visual Studio 사용
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: depot_tools 설치
        shell: cmd
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo C:\depot_tools>> %GITHUB_PATH%

      - name: V8 소스 받기
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          mkdir C:\v8-build
          cd /d C:\v8-build
          call gclient config https://chromium.googlesource.com/v8/v8.git
          call gclient sync --revision %V8_VERSION% --no-history --shallow

      - name: Windows 빌드 환경 패치 (VS 2022 + SDK 경로)
        shell: pwsh
        run: |
          # 1. vs_toolchain.py: MSVS_VERSIONS에 2022 추가
          $p = 'C:\v8-build\v8\build\vs_toolchain.py'
          $c = Get-Content $p -Raw
          $c = $c -replace "MSVS_VERSIONS = collections\.OrderedDict\(\[\s*\(`'2019`', `'16\.0`'\),\s*\(`'2017`', `'15\.0`'\),\s*\]\)", "MSVS_VERSIONS = collections.OrderedDict([('2022', '17.0'), ('2019', '16.0'), ('2017', '15.0')])"
          Set-Content $p -Value $c -NoNewline

          # 2. setup_toolchain.py: vcvarsall.bat 경로 수정 (VS 2022는 VC/Auxiliary/Build에 위치)
          $p2 = 'C:\v8-build\v8\build\toolchain\win\setup_toolchain.py'
          $c2 = Get-Content $p2 -Raw
          $c2 = $c2 -replace "VC/vcvarsall\.bat", "VC/Auxiliary/Build/vcvarsall.bat"
          Set-Content $p2 -Value $c2 -NoNewline

          # 3. jinja2/tests.py: collections.Mapping → collections.abc.Mapping (Python 3.10+ 호환)
          $p3 = 'C:\v8-build\v8\third_party\jinja2\tests.py'
          $c3 = Get-Content $p3 -Raw
          $c3 = $c3 -replace "from collections import Mapping", "from collections.abc import Mapping"
          Set-Content $p3 -Value $c3 -NoNewline

          Write-Host "[OK] vs_toolchain.py + setup_toolchain.py + jinja2 패치 완료"

      - name: VS 2022 경로 찾기
        shell: pwsh
        id: vs
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS Install Path: $vs"
          echo "VS_INSTALL_PATH=$vs" >> $env:GITHUB_ENV

      - name: Windows SDK 경로 찾기
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVer = (Get-ChildItem "$sdkDir\lib" | Where-Object { $_.Name -match "^10\." } | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Windows SDK: $sdkVer"
          echo "WINSDK_DIR=$sdkDir" >> $env:GITHUB_ENV
          echo "WINSDK_VER=$sdkVer" >> $env:GITHUB_ENV

      - name: V8 모놀리스 빌드
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" amd64
          set PATH=C:\depot_tools;%PATH%
          set GYP_MSVS_VERSION=2022
          set vs2022_install=%VS_INSTALL_PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          cd /d C:\v8-build\v8
          call gn.bat gen out/release --args="is_debug=false target_cpu=\"x64\" v8_monolithic=true v8_use_external_startup_data=false is_component_build=false v8_enable_i18n_support=false treat_warnings_as_errors=false is_clang=true use_lld=false"
          call ninja.exe -C out/release v8_monolith

      - name: JNI 브릿지 컴파일
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" amd64
          mkdir build\windows-x86_64
          set CLANG_CL=C:\v8-build\v8\third_party\llvm-build\Release+Asserts\bin\clang-cl.exe
          set LLD_LINK=C:\v8-build\v8\third_party\llvm-build\Release+Asserts\bin\lld-link.exe
          REM __config_site 생성 (V8 빌드에서 사용하는 libc++ 설정)
          (
            echo #define _LIBCPP_HAS_NO_ALIGNED_ALLOCATION
            echo #define _LIBCPP_ABI_UNSTABLE
            echo #define _LIBCPP_DISABLE_VISIBILITY_ANNOTATIONS
            echo #define _LIBCXXABI_DISABLE_VISIBILITY_ANNOTATIONS
            echo #define _LIBCPP_ENABLE_NODISCARD
            echo #define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS
          ) > C:\v8-build\v8\buildtools\third_party\libc++\trunk\include\__config_site
          REM clang-cl로 컴파일 (V8과 동일한 libc++ 사용)
          %CLANG_CL% /std:c++17 /O2 /DNDEBUG /DV8_COMPRESS_POINTERS /DV8_31BIT_SMIS_ON_64BIT_ARCH /w ^
            -I"%JAVA_HOME%\include" -I"%JAVA_HOME%\include\win32" ^
            -Iv8-include -Ijni ^
            -IC:\v8-build\v8\buildtools\third_party\libc++\trunk\include ^
            -IC:\v8-build\v8\buildtools\third_party\libc++abi\trunk\include ^
            /c jni\kr_co_coocon_v8_V8Impl.cpp ^
            /Fobuild\windows-x86_64\v8impl.obj
          %LLD_LINK% /DLL /OUT:build\windows-x86_64\libcooconv8.dll /NODEFAULTLIB:libc++ ^
            build\windows-x86_64\v8impl.obj ^
            C:\v8-build\v8\out\release\obj\v8_monolith.lib ^
            C:\v8-build\v8\out\release\obj\buildtools\third_party\libc++\libc++\*.obj ^
            userenv.lib IPHLPAPI.lib Ws2_32.lib WINMM.lib psapi.lib advapi32.lib dbghelp.lib msvcprt.lib

      - name: 검증
        shell: cmd
        run: |
          dir build\windows-x86_64\libcooconv8.dll

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/windows-x86_64/libcooconv8.dll

  # ===================================================
  # Windows x86 (32bit)
  # ===================================================
  windows-x86:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows-x86' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: depot_tools 설치
        shell: cmd
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo C:\depot_tools>> %GITHUB_PATH%

      - name: V8 소스 받기
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          mkdir C:\v8-build
          cd /d C:\v8-build
          call gclient config https://chromium.googlesource.com/v8/v8.git
          call gclient sync --revision %V8_VERSION% --no-history --shallow

      - name: Windows 빌드 환경 패치 (VS 2022 + SDK 경로)
        shell: pwsh
        run: |
          $p = 'C:\v8-build\v8\build\vs_toolchain.py'
          $c = Get-Content $p -Raw
          $c = $c -replace "MSVS_VERSIONS = collections\.OrderedDict\(\[\s*\(`'2019`', `'16\.0`'\),\s*\(`'2017`', `'15\.0`'\),\s*\]\)", "MSVS_VERSIONS = collections.OrderedDict([('2022', '17.0'), ('2019', '16.0'), ('2017', '15.0')])"
          Set-Content $p -Value $c -NoNewline

          $p2 = 'C:\v8-build\v8\build\toolchain\win\setup_toolchain.py'
          $c2 = Get-Content $p2 -Raw
          $c2 = $c2 -replace "VC/vcvarsall\.bat", "VC/Auxiliary/Build/vcvarsall.bat"
          Set-Content $p2 -Value $c2 -NoNewline

          $p3 = 'C:\v8-build\v8\third_party\jinja2\tests.py'
          $c3 = Get-Content $p3 -Raw
          $c3 = $c3 -replace "from collections import Mapping", "from collections.abc import Mapping"
          Set-Content $p3 -Value $c3 -NoNewline

          Write-Host "[OK] 패치 완료"

      - name: VS 2022 경로 찾기
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS Install Path: $vs"
          echo "VS_INSTALL_PATH=$vs" >> $env:GITHUB_ENV

      - name: Windows SDK 경로 찾기
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVer = (Get-ChildItem "$sdkDir\lib" | Where-Object { $_.Name -match "^10\." } | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Windows SDK: $sdkVer"
          echo "WINSDK_DIR=$sdkDir" >> $env:GITHUB_ENV
          echo "WINSDK_VER=$sdkVer" >> $env:GITHUB_ENV

      - name: V8 모놀리스 빌드
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          set PATH=C:\depot_tools;%PATH%
          set GYP_MSVS_VERSION=2022
          set vs2022_install=%VS_INSTALL_PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          cd /d C:\v8-build\v8
          call gn.bat gen out/release --args="is_debug=false target_cpu=\"x86\" v8_monolithic=true v8_use_external_startup_data=false is_component_build=false v8_enable_i18n_support=false treat_warnings_as_errors=false is_clang=true use_lld=false"
          call ninja.exe -C out/release v8_monolith

      - name: JNI 브릿지 컴파일
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          mkdir build\windows-x86
          set CLANG_CL=C:\v8-build\v8\third_party\llvm-build\Release+Asserts\bin\clang-cl.exe
          set LLD_LINK=C:\v8-build\v8\third_party\llvm-build\Release+Asserts\bin\lld-link.exe
          (
            echo #define _LIBCPP_HAS_NO_ALIGNED_ALLOCATION
            echo #define _LIBCPP_ABI_UNSTABLE
            echo #define _LIBCPP_DISABLE_VISIBILITY_ANNOTATIONS
            echo #define _LIBCXXABI_DISABLE_VISIBILITY_ANNOTATIONS
            echo #define _LIBCPP_ENABLE_NODISCARD
            echo #define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS
          ) > C:\v8-build\v8\buildtools\third_party\libc++\trunk\include\__config_site
          %CLANG_CL% /O2 /DNDEBUG /w ^
            -m32 ^
            -I"%JAVA_HOME%\include" -I"%JAVA_HOME%\include\win32" ^
            -Iv8-include -Ijni ^
            -IC:\v8-build\v8\buildtools\third_party\libc++\trunk\include ^
            -IC:\v8-build\v8\buildtools\third_party\libc++abi\trunk\include ^
            /c jni\kr_co_coocon_v8_V8Impl.cpp ^
            /Fobuild\windows-x86\v8impl.obj
          %LLD_LINK% /DLL /OUT:build\windows-x86\libcooconv8.dll /NODEFAULTLIB:libc++ /MACHINE:X86 ^
            build\windows-x86\v8impl.obj ^
            C:\v8-build\v8\out\release\obj\v8_monolith.lib ^
            C:\v8-build\v8\out\release\obj\buildtools\third_party\libc++\libc++\*.obj ^
            userenv.lib IPHLPAPI.lib Ws2_32.lib WINMM.lib psapi.lib advapi32.lib dbghelp.lib msvcprt.lib

      - name: 검증
        shell: cmd
        run: |
          dir build\windows-x86\libcooconv8.dll

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: build/windows-x86/libcooconv8.dll

  # ===================================================
  # Android (arm64-v8a / armeabi-v7a / x86_64 / x86)
  #   - Ubuntu 호스트에서 4개 ABI 크로스컴파일
  #   - 산출물: libv8_monolith.a (사내 GitLab 오프라인 링크용) + libcooconv8.so (검증/jniLibs용)
  # ===================================================
  android:
    if: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target_cpu: arm64
            v8_arch: android.arm64
            ndk_triple: aarch64-linux-android
            page16k: true
          - abi: armeabi-v7a
            target_cpu: arm
            v8_arch: android.arm
            ndk_triple: armv7a-linux-androideabi
            page16k: false
          - abi: x86_64
            target_cpu: x64
            v8_arch: android.x64
            ndk_triple: x86_64-linux-android
            page16k: true
          - abi: x86
            target_cpu: x86
            v8_arch: android.x86
            ndk_triple: i686-linux-android
            page16k: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          # 구버전 V8(2021) DEPS 에 py2 vpython 훅('vpython ... -vpython-tool install')이 있으나
          # py2 cpython 이 더 이상 제공되지 않아 실패. monolith 빌드(py3)엔 불필요하므로 shim 으로 처리:
          #   -vpython-tool 호출(py2 venv 사전설치)은 no-op, 그 외는 vpython3 로 위임. gclient 본체는 무영향.
          cat > "$HOME/depot_tools/vpython" <<'VPY'
          #!/usr/bin/env bash
          for a in "$@"; do
            [ "$a" = "-vpython-tool" ] && exit 0
          done
          exec vpython3 "$@"
          VPY
          chmod +x "$HOME/depot_tools/vpython"

      - name: V8 소스 받기 (Android 의존성 포함)
        run: |
          cd $HOME
          mkdir v8-build && cd v8-build
          gclient config https://chromium.googlesource.com/v8/v8.git
          # Android NDK/sysroot 의존성을 함께 받도록 target_os 지정
          echo "target_os = ['android']" >> .gclient
          gclient sync --revision ${{ env.V8_VERSION }} --no-history --shallow

      - name: V8 소스 패치
        run: |
          bash patches/apply-patches.sh $HOME/v8-build/v8

      - name: V8 모놀리스 빌드 (${{ matrix.abi }})
        run: |
          cd $HOME/v8-build/v8
          # 로컬 v8/android-*/args.gn 와 동일한 구성 (pointer compression OFF 포함)
          gn gen out/release --args='
            is_debug=false
            target_os="android"
            target_cpu="${{ matrix.target_cpu }}"
            v8_target_cpu="${{ matrix.target_cpu }}"
            v8_monolithic=true
            v8_use_external_startup_data=false
            is_component_build=false
            use_custom_libcxx=false
            v8_enable_i18n_support=false
            v8_enable_pointer_compression=false
            v8_android_log_stdout=true
            symbol_level=0
            treat_warnings_as_errors=false
            clang_use_chrome_plugins=false
          '
          ninja -C out/release v8_monolith

      - name: JNI 브릿지 컴파일 + 링크 (NDK, ${{ matrix.abi }})
        run: |
          set -e
          V8=$HOME/v8-build/v8
          # gclient 이 받은 NDK 위치 자동 탐지 (버전에 따라 android_ndk / android_toolchain 등 경로가 다름)
          TOOLCHAIN=$(find $V8/third_party -type d -path '*toolchains/llvm/prebuilt/linux-x86_64' 2>/dev/null | head -1)
          if [ -z "$TOOLCHAIN" ]; then
            echo "[ERROR] NDK 툴체인을 찾을 수 없습니다. third_party 내 android 관련 디렉터리:"
            ls -d $V8/third_party/*android* 2>/dev/null || true
            exit 1
          fi
          echo "NDK 툴체인: $TOOLCHAIN"
          API=21
          CXX=$TOOLCHAIN/bin/${{ matrix.ndk_triple }}$API-clang++
          OUT=build/${{ matrix.abi }}
          mkdir -p $OUT

          # 컴파일: pointer compression OFF 이므로 V8_COMPRESS_POINTERS 정의하지 않음 (모놀리스와 일치)
          $CXX -Iv8-include -Ijni \
            -fPIC -std=c++17 -O3 -DNDEBUG -w \
            -c jni/kr_co_coocon_v8_V8Impl.cpp -o $OUT/v8impl.o

          # 링크 플래그: 로컬 rebuild_native.sh 와 동일 (Full RELRO, separate-code, static-libstdc++)
          LDFLAGS="-shared -llog -s -static-libstdc++ -Wl,-z,relro -Wl,-z,now -Wl,-z,separate-code"
          if [ "${{ matrix.page16k }}" = "true" ]; then
            # 64비트 ABI: 16KB 페이지 정렬
            LDFLAGS="$LDFLAGS -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          fi

          $CXX $LDFLAGS -o $OUT/libcooconv8.so \
            $OUT/v8impl.o \
            $V8/out/release/obj/libv8_monolith.a

          # 사내 폐쇄망 GitLab 오프라인 링크용으로 모놀리스 .a 도 함께 업로드
          cp $V8/out/release/obj/libv8_monolith.a $OUT/libv8_monolith.a

      - name: 검증 (WebAssembly 포함 여부)
        run: |
          file build/${{ matrix.abi }}/libcooconv8.so
          ls -lh build/${{ matrix.abi }}/libcooconv8.so build/${{ matrix.abi }}/libv8_monolith.a
          echo "libcooconv8.so 내 'WebAssembly' 문자열 수: $(strings -a build/${{ matrix.abi }}/libcooconv8.so | grep -c WebAssembly)"

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            build/${{ matrix.abi }}/libcooconv8.so
            build/${{ matrix.abi }}/libv8_monolith.a
